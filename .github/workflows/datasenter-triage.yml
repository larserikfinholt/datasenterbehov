name: Datasenter – vurder innmelding

# Automatisk vurdering av innmeldinger og nye opplysninger i kommentarer.
# Billig og rask: ingen bygg, bare parsing av saken, sjekk av inntil tre kilder og oppdatering av én kommentar.
# Saksteksten er upålitelig input. Den leses bare av scripts/issue-bot.mjs og settes aldri inn i shell-kommandoer.

on:
  issues:
    types: [opened, edited, reopened, labeled]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      issue:
        description: Saksnummer som skal vurderes på nytt. Tomt oppretter bare etikettene.
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: datasenter-issue-${{ github.event.issue.number || inputs.issue || 'labels' }}
  cancel-in-progress: false

jobs:
  triage:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.issue.pull_request &&
        (github.event_name != 'issue_comment' || github.event.comment.user.type == 'User') &&
        (github.event.action != 'labeled' || github.event.label.name == 'data') &&
        (contains(github.event.issue.body, '### Beskrivelse') || contains(github.event.issue.labels.*.name, 'data')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Opprett etiketter
        if: github.event_name == 'workflow_dispatch' && inputs.issue == ''
        run: node scripts/issue-bot.mjs labels
      - name: Vurder innmeldingen
        if: github.event_name != 'workflow_dispatch' || inputs.issue != ''
        env:
          ISSUE_NUMBER: ${{ inputs.issue }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node scripts/issue-bot.mjs triage
