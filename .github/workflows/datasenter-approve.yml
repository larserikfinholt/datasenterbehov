name: Datasenter – lag PR fra godkjent innmelding

# Starter når en moderator setter etiketten «status: godkjent» på en innmelding. Den automatiske vurderingen setter
# aldri denne etiketten selv. Kjøringen sjekker at personen har skrivetilgang, oppdaterer data/datacenters.csv,
# kjører datapipeline, tester, bygg og e2e, og åpner en PR fra grenen data/issue-<nr>. Merge gjøres manuelt.
#
# Autentisering: uten hemmeligheten DATA_BOT_TOKEN brukes GITHUB_TOKEN. Da må innstillingen «Allow GitHub Actions to
# create and approve pull requests» være på. Pages-publisering etter merge utløses av merge-pushen og påvirkes ikke.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

# Egen gruppe, ikke delt med vurderingen: GitHub beholder bare én ventende kjøring per gruppe, så en redigering kunne
# ellers ha kastet en ventende godkjenning. approve-finish sjekker i stedet at saken ikke er endret underveis.
concurrency:
  group: datasenter-approve-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  approve:
    if: github.event.label.name == 'status: godkjent' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PR_TOKEN: ${{ secrets.DATA_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DATA_BOT_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Kontroller moderator og oppdater CSV
        id: prepare
        run: node scripts/issue-bot.mjs approve-prepare
      - name: Datapipeline, tester, bygg og e2e
        if: steps.prepare.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ''
          PR_TOKEN: ''
        run: node scripts/issue-bot.mjs approve-verify
      - name: Last opp forhåndsvisning av kartet
        if: steps.prepare.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: kart-forhandsvisning
          path: artifacts/*-map.png
          if-no-files-found: warn
      - name: Push gren
        if: steps.prepare.outputs.skip == 'false'
        env:
          BRANCH: ${{ steps.prepare.outputs.branch }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add data/datacenters.csv
          git commit -m "data: oppdater fra innmelding #$ISSUE"
          git push --force origin "$BRANCH"
      - name: Opprett eller oppdater PR
        if: steps.prepare.outputs.skip == 'false'
        run: node scripts/issue-bot.mjs approve-finish
      - name: Forklar feil i saken
        if: failure()
        run: node scripts/issue-bot.mjs approve-failed
